name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders (runtime values come from Render dashboard)
          SESSION_SECRET: ci-placeholder-secret-not-for-production
          PAYPAL_CLIENT_ID: ci-placeholder
          PAYPAL_CLIENT_SECRET: ci-placeholder
          OPENROUTER_API_KEY: ci-placeholder
          AI_MODEL: nvidia/nemotron-3.5-super-vl:free
          AI_FALLBACKS: google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free

      - name: Reset demo database (smoke test)
        run: npm run db:reset
        env:
          SESSION_SECRET: ci-placeholder-secret-not-for-production
          PAYPAL_PAYOUT_RECEIVER: ci-test@personal.example.com
          AI_MODEL: nvidia/nemotron-3.5-super-vl:free
          AI_FALLBACKS: google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free